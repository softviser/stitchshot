# Builds the Windows executables and installer (signed when SignPath is configured) and the
# Linux and macOS archives from source. Runs when a version tag is pushed, or by hand from
# the Actions tab. A tag push also publishes a GitHub release with every file attached.
#
# Signing starts once these are set under Settings > Secrets and variables > Actions:
#   variable SIGNPATH_ORGANIZATION_ID, secret SIGNPATH_API_TOKEN
# Until then the job still builds and uploads the executables, unsigned.
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/StitchShot.App/StitchShot.App.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/StitchShot.Core.Tests -c Release

      - name: Publish with .NET bundled
        run: >
          dotnet publish src/StitchShot.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish/full

      - name: Publish for machines with .NET 8
        run: >
          dotnet publish src/StitchShot.App -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=none -o publish/small

      - name: Name the executables
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item publish/full/StitchShot.exe "dist/StitchShot-$env:VERSION-win-x64.exe"
          Copy-Item publish/small/StitchShot.exe "dist/StitchShot-$env:VERSION-win-x64-requires-net8.exe"

      - name: Upload unsigned executables
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned
          path: dist/*.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: stitchshot
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.version.outputs.value) }}
          # Every release waits for an approver in SignPath, so allow a day for it.
          wait-for-completion-timeout-in-seconds: 86400
          output-artifact-directory: signed

      # shortcut: the installer wraps the signed exe but is not signed itself; add a second
      # SignPath round for it once signing is in place and SmartScreen complains about the setup.
      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $folder = if (Test-Path signed) { 'signed' } else { 'dist' }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=$env:VERSION" "/DSourceExe=$PWD\$folder\StitchShot-$env:VERSION-win-x64.exe" "/O$PWD\$folder" installer\StitchShot.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Write checksums
        shell: pwsh
        run: |
          $folder = if (Test-Path signed) { 'signed' } else { 'dist' }
          New-Item -ItemType Directory release | Out-Null
          Copy-Item "$folder/*.exe" release
          Get-ChildItem release/*.exe | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii release/SHA256SUMS.txt

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: stitchshot-${{ steps.version.outputs.value }}-windows
          path: release/
          if-no-files-found: error

  build-unix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        run: |
          version=$(grep -oPm1 '(?<=<Version>)[^<]+' src/StitchShot.App/StitchShot.App.csproj)
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test tests/StitchShot.Core.Tests -c Release

      - name: Publish with .NET bundled
        run: >
          dotnet publish src/StitchShot.App -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish

      - name: Archive
        env:
          NAME: StitchShot-${{ steps.version.outputs.value }}-${{ matrix.rid }}
          VERSION: ${{ steps.version.outputs.value }}
          RID: ${{ matrix.rid }}
        run: |
          mkdir -p release
          if [[ "$RID" == osx-* ]]; then
            # A bundle, so macOS attaches the Screen Recording and Accessibility permissions to StitchShot itself.
            app=publish/StitchShot.app
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            mv publish/StitchShot "$app/Contents/MacOS/StitchShot"
            sed "s/__VERSION__/$VERSION/g" installer/macos/Info.plist > "$app/Contents/Info.plist"
            cp installer/macos/StitchShot.icns "$app/Contents/Resources/StitchShot.icns"
            tar -C publish -czf "release/$NAME.tar.gz" StitchShot.app
          else
            tar -C publish -czf "release/$NAME.tar.gz" StitchShot
          fi
          (cd release && sha256sum "$NAME.tar.gz" > "$NAME.sha256")

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: stitchshot-${{ steps.version.outputs.value }}-${{ matrix.rid }}
          path: release/
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [build, build-unix]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download build outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'stitchshot-*' --dir files

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" files/*/* --repo "$GITHUB_REPOSITORY"
          --title "StitchShot ${GITHUB_REF_NAME#v}" --generate-notes
